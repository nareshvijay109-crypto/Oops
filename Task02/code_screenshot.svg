<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="356" viewBox="0 0 1180 356"><rect width="100%" height="100%" fill="#0d1117"/><rect x="0" y="0" width="1180" height="30" fill="#161b22"/><text x="20" y="21" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="bold">Task02 - C++ source</text><text x="22" y="44" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  1</tspan><tspan dx="16">#include &lt;iostream&gt;</tspan></text><text x="22" y="66" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  2</tspan><tspan dx="16">enum class Zone { Inner, Middle, Outer };</tspan></text><text x="22" y="88" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  3</tspan><tspan dx="16">constexpr long long INNER_FARE_PAISE = 1000;</tspan></text><text x="22" y="110" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  4</tspan><tspan dx="16">constexpr long long MIDDLE_FARE_PAISE = 2000;</tspan></text><text x="22" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  5</tspan><tspan dx="16">constexpr long long OUTER_FARE_PAISE = 3000;</tspan></text><text x="22" y="154" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  6</tspan><tspan dx="16">constexpr int PEAK_PERCENT = 20;</tspan></text><text x="22" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  7</tspan><tspan dx="16">constexpr long long MIN_BALANCE_PAISE = 5000;</tspan></text><text x="22" y="198" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  8</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="220" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  9</tspan><tspan dx="16">    Zone z = Zone::Outer;</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">    long long fare = (z == Zone::Outer) ? OUTER_FARE_PAISE : INNER_FARE_PAISE;</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Outer fare paise=&quot; &lt;&lt; fare</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">              &lt;&lt; &quot;, peak percent=&quot; &lt;&lt; PEAK_PERCENT</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">              &lt;&lt; &quot;, minimum balance paise=&quot; &lt;&lt; MIN_BALANCE_PAISE &lt;&lt; '\n';</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">}</tspan></text></svg>