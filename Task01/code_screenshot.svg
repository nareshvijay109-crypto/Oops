ol canTravel(long long fare) const { return balancePaise - fare &gt;= 5000; }</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">    bool deduct(long long fare) { if (!canTravel(fare)) return false; balancePaise -= fare; return true; }</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">    long long balance() const { return balancePaise; }</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">};</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">    Passenger p{&quot;Passenger A&quot;, true, false};</tspan></text><text x="22" y="352" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 15</tspan><tspan dx="16">    Journey j{1, 3, 9, true};</tspan></text><text x="22" y="374" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 16</tspan><tspan dx="16">    SmartCard c{10000};</tspan></text><text x="22" y="396" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 17</tspan><tspan dx="16">    std::cout &lt;&lt; p.name &lt;&lt; &quot; zone &quot; &lt;&lt; j.farthestZone</tspan></text><text x="22" y="418" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 18</tspan><tspan dx="16">              &lt;&lt; &quot; travel=&quot; &lt;&lt; std::boolalpha &lt;&lt; c.deduct(1200)</tspan></text><text x="22" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 19</tspan><tspan dx="16">              &lt;&lt; &quot; balance_paise=&quot; &lt;&lt; c.balance() &lt;&lt; '\n';</tspan></text><text x="22" y="462" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 20</tspan><tspan dx="16">}</tspan></text></svg>