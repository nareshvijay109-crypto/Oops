<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1236" viewBox="0 0 1180 1236"><rect width="100%" height="100%" fill="#0d1117"/><rect x="0" y="0" width="1180" height="30" fill="#161b22"/><text x="20" y="21" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="bold">Task09 - C++ source</text><text x="22" y="44" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  1</tspan><tspan dx="16">#include &lt;iostream&gt;</tspan></text><text x="22" y="66" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  2</tspan><tspan dx="16">#include &lt;string&gt;</tspan></text><text x="22" y="88" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  3</tspan><tspan dx="16">enum class Zone { Inner, Middle, Outer };</tspan></text><text x="22" y="110" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  4</tspan><tspan dx="16">constexpr long long BASE[] = {1000,2000,3000};</tspan></text><text x="22" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  5</tspan><tspan dx="16">constexpr long long MIN_BALANCE = 5000;</tspan></text><text x="22" y="154" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  6</tspan><tspan dx="16">bool validZone(Zone z) {</tspan></text><text x="22" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  7</tspan><tspan dx="16">    int index=static_cast&lt;int&gt;(z);</tspan></text><text x="22" y="198" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  8</tspan><tspan dx="16">    return index &gt;= 0 &amp;&amp; index &lt; 3;</tspan></text><text x="22" y="220" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  9</tspan><tspan dx="16">}</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">long long fare(Zone z, int hour) {</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">    if (!validZone(z) || hour &lt; 0 || hour &gt; 23) return -1;</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">    long long b = BASE[static_cast&lt;int&gt;(z)];</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">    bool peak = (hour &gt;= 8 &amp;&amp; hour &lt; 10) || (hour &gt;= 17 &amp;&amp; hour &lt; 20);</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">    return peak ? b + b*20/100 : b;</tspan></text><text x="22" y="352" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 15</tspan><tspan dx="16">}</tspan></text><text x="22" y="374" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 16</tspan><tspan dx="16">bool canTravel(long long bal,long long f) {</tspan></text><text x="22" y="396" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 17</tspan><tspan dx="16">    return f &gt;= 0 &amp;&amp; bal &gt;= f &amp;&amp; bal-f &gt;= MIN_BALANCE;</tspan></text><text x="22" y="418" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 18</tspan><tspan dx="16">}</tspan></text><text x="22" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 19</tspan><tspan dx="16">bool recharge(long long&amp; balance, long long amount) {</tspan></text><text x="22" y="462" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 20</tspan><tspan dx="16">    if (amount &lt; 0) return false;</tspan></text><text x="22" y="484" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 21</tspan><tspan dx="16">    balance += amount;</tspan></text><text x="22" y="506" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 22</tspan><tspan dx="16">    return true;</tspan></text><text x="22" y="528" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 23</tspan><tspan dx="16">}</tspan></text><text x="22" y="550" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 24</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="572" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 25</tspan><tspan dx="16">    struct Test { const char* name; Zone zone; int hour; long long balance; long long expected; bool allowed; };</tspan></text><text x="22" y="594" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 26</tspan><tspan dx="16">    Test tests[] = {</tspan></text><text x="22" y="616" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 27</tspan><tspan dx="16">      {&quot;Inner offpeak&quot;,Zone::Inner,11,10000,1000,true},</tspan></text><text x="22" y="638" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 28</tspan><tspan dx="16">      {&quot;Middle peak 8AM&quot;,Zone::Middle,8,10000,2400,true},</tspan></text><text x="22" y="660" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 29</tspan><tspan dx="16">      {&quot;Outer peak 9AM&quot;,Zone::Outer,9,10000,3600,true},</tspan></text><text x="22" y="682" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 30</tspan><tspan dx="16">      {&quot;10AM boundary&quot;,Zone::Outer,10,10000,3000,true},</tspan></text><text x="22" y="704" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 31</tspan><tspan dx="16">      {&quot;5PM boundary&quot;,Zone::Inner,17,10000,1200,true},</tspan></text><text x="22" y="726" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 32</tspan><tspan dx="16">      {&quot;8PM boundary&quot;,Zone::Inner,20,10000,1000,true},</tspan></text><text x="22" y="748" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 33</tspan><tspan dx="16">      {&quot;exact Rs50 left&quot;,Zone::Outer,10,8000,3000,true},</tspan></text><text x="22" y="770" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 34</tspan><tspan dx="16">      {&quot;low balance&quot;,Zone::Outer,10,7999,3000,false}</tspan></text><text x="22" y="792" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 35</tspan><tspan dx="16">    };</tspan></text><text x="22" y="814" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 36</tspan><tspan dx="16">    int passed=0;</tspan></text><text x="22" y="836" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 37</tspan><tspan dx="16">    for (const auto&amp; t:tests) {</tspan></text><text x="22" y="858" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 38</tspan><tspan dx="16">      long long actual=fare(t.zone,t.hour);</tspan></text><text x="22" y="880" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 39</tspan><tspan dx="16">      bool allowed=canTravel(t.balance,actual);</tspan></text><text x="22" y="902" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 40</tspan><tspan dx="16">      bool ok=(actual==t.expected &amp;&amp; allowed==t.allowed);</tspan></text><text x="22" y="924" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 41</tspan><tspan dx="16">      std::cout &lt;&lt; t.name &lt;&lt; &quot;: fare_paise=&quot; &lt;&lt; actual</tspan></text><text x="22" y="946" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 42</tspan><tspan dx="16">                &lt;&lt; &quot; allowed=&quot; &lt;&lt; std::boolalpha &lt;&lt; allowed</tspan></text><text x="22" y="968" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 43</tspan><tspan dx="16">                &lt;&lt; &quot; [&quot; &lt;&lt; (ok?&quot;PASS&quot;:&quot;FAIL&quot;) &lt;&lt; &quot;]\n&quot;;</tspan></text><text x="22" y="990" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 44</tspan><tspan dx="16">      passed += ok;</tspan></text><text x="22" y="1012" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 45</tspan><tspan dx="16">    }</tspan></text><text x="22" y="1034" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 46</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Passed &quot; &lt;&lt; passed &lt;&lt; &quot;/&quot; &lt;&lt; (sizeof(tests)/sizeof(tests[0])) &lt;&lt; '\n';</tspan></text><text x="22" y="1056" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 47</tspan><tspan dx="16">    long long fiveJourneyTotal = fare(Zone::Inner,11) + fare(Zone::Middle,8)</tspan></text><text x="22" y="1078" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 48</tspan><tspan dx="16">                               + fare(Zone::Outer,9) + fare(Zone::Middle,11)</tspan></text><text x="22" y="1100" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 49</tspan><tspan dx="16">                               + fare(Zone::Outer,11);</tspan></text><text x="22" y="1122" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 50</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Five-journey total Rs &quot; &lt;&lt; fiveJourneyTotal/100 &lt;&lt; '\n';</tspan></text><text x="22" y="1144" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 51</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Unknown zone rejected=&quot; &lt;&lt; (fare(static_cast&lt;Zone&gt;(99),12)&lt;0) &lt;&lt; '\n';</tspan></text><text x="22" y="1166" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 52</tspan><tspan dx="16">    long long wallet=10000;</tspan></text><text x="22" y="1188" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 53</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Negative recharge rejected=&quot; &lt;&lt; (!recharge(wallet,-500)) &lt;&lt; '\n';</tspan></text><text x="22" y="1210" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 54</tspan><tspan dx="16">}</tspan></text></svg>