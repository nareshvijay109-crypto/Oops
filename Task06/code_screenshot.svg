<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="774" viewBox="0 0 1180 774"><rect width="100%" height="100%" fill="#0d1117"/><rect x="0" y="0" width="1180" height="30" fill="#161b22"/><text x="20" y="21" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="bold">Task06 - C++ source</text><text x="22" y="44" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  1</tspan><tspan dx="16">#include &lt;iomanip&gt;</tspan></text><text x="22" y="66" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  2</tspan><tspan dx="16">#include &lt;iostream&gt;</tspan></text><text x="22" y="88" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  3</tspan><tspan dx="16">enum class Zone { Inner, Middle, Outer };</tspan></text><text x="22" y="110" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  4</tspan><tspan dx="16">constexpr int BASE_PAISE[] = {1000, 2000, 3000};</tspan></text><text x="22" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  5</tspan><tspan dx="16">constexpr int PEAK_SURCHARGE_PERCENT = 20;</tspan></text><text x="22" y="154" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  6</tspan><tspan dx="16">constexpr long long MIN_BALANCE_PAISE = 5000;</tspan></text><text x="22" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  7</tspan><tspan dx="16">long long fare(Zone z, bool peak) {</tspan></text><text x="22" y="198" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  8</tspan><tspan dx="16">    long long base = 0;</tspan></text><text x="22" y="220" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  9</tspan><tspan dx="16">    switch (z) {</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">        case Zone::Inner: base = BASE_PAISE[0]; break;</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">        case Zone::Middle: base = BASE_PAISE[1]; break;</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">        case Zone::Outer: base = BASE_PAISE[2]; break;</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">        default: return -1;</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">    }</tspan></text><text x="22" y="352" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 15</tspan><tspan dx="16">    return peak ? base + (base * PEAK_SURCHARGE_PERCENT) / 100 : base;</tspan></text><text x="22" y="374" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 16</tspan><tspan dx="16">}</tspan></text><text x="22" y="396" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 17</tspan><tspan dx="16">bool canTravel(long long balance, long long f) {</tspan></text><text x="22" y="418" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 18</tspan><tspan dx="16">    return f &gt;= 0 &amp;&amp; balance &gt;= f &amp;&amp; balance - f &gt;= MIN_BALANCE_PAISE;</tspan></text><text x="22" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 19</tspan><tspan dx="16">}</tspan></text><text x="22" y="462" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 20</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="484" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 21</tspan><tspan dx="16">    long long balance = 10000;</tspan></text><text x="22" y="506" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 22</tspan><tspan dx="16">    struct Trip { Zone zone; bool peak; };</tspan></text><text x="22" y="528" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 23</tspan><tspan dx="16">    Trip trips[] = {{Zone::Inner,false},{Zone::Outer,true},{Zone::Middle,false}};</tspan></text><text x="22" y="550" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 24</tspan><tspan dx="16">    for (const Trip&amp; t : trips) {</tspan></text><text x="22" y="572" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 25</tspan><tspan dx="16">        long long f = fare(t.zone,t.peak);</tspan></text><text x="22" y="594" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 26</tspan><tspan dx="16">        if (canTravel(balance,f)) {</tspan></text><text x="22" y="616" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 27</tspan><tspan dx="16">            balance -= f;</tspan></text><text x="22" y="638" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 28</tspan><tspan dx="16">            std::cout &lt;&lt; &quot;Fare Rs &quot; &lt;&lt; f/100 &lt;&lt; '.' &lt;&lt; std::setw(2)</tspan></text><text x="22" y="660" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 29</tspan><tspan dx="16">                      &lt;&lt; std::setfill('0') &lt;&lt; f%100 &lt;&lt; std::setfill(' ');</tspan></text><text x="22" y="682" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 30</tspan><tspan dx="16">        } else std::cout &lt;&lt; &quot;Denied (low balance)&quot;;</tspan></text><text x="22" y="704" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 31</tspan><tspan dx="16">        std::cout &lt;&lt; &quot; balance Rs &quot; &lt;&lt; balance/100 &lt;&lt; '\n';</tspan></text><text x="22" y="726" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 32</tspan><tspan dx="16">    }</tspan></text><text x="22" y="748" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 33</tspan><tspan dx="16">}</tspan></text></svg>