b;</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">    }</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">};</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">class SmartCard {</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">    long long balance;</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">public:</tspan></text><text x="22" y="352" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 15</tspan><tspan dx="16">    explicit SmartCard(long long b):balance(b){}</tspan></text><text x="22" y="374" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 16</tspan><tspan dx="16">    bool deduct(long long f) {</tspan></text><text x="22" y="396" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 17</tspan><tspan dx="16">        if (f&lt;0 || balance-f&lt;5000) return false;</tspan></text><text x="22" y="418" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 18</tspan><tspan dx="16">        balance-=f; return true;</tspan></text><text x="22" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 19</tspan><tspan dx="16">    }</tspan></text><text x="22" y="462" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 20</tspan><tspan dx="16">    long long getBalance() const { return balance; }</tspan></text><text x="22" y="484" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 21</tspan><tspan dx="16">};</tspan></text><text x="22" y="506" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 22</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="528" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 23</tspan><tspan dx="16">    FareTable fares; SmartCard card(10000);</tspan></text><text x="22" y="550" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 24</tspan><tspan dx="16">    auto f=fares.get(Zone::Outer,true);</tspan></text><text x="22" y="572" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 25</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Fare paise=&quot; &lt;&lt; f &lt;&lt; &quot; accepted=&quot; &lt;&lt; std::boolalpha</tspan></text><text x="22" y="594" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 26</tspan><tspan dx="16">              &lt;&lt; card.deduct(f) &lt;&lt; &quot; balance paise=&quot; &lt;&lt; card.getBalance() &lt;&lt; '\n';</tspan></text><text x="22" y="616" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 27</tspan><tspan dx="16">}</tspan></text></svg>