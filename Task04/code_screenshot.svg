<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="356" viewBox="0 0 1180 356"><rect width="100%" height="100%" fill="#0d1117"/><rect x="0" y="0" width="1180" height="30" fill="#161b22"/><text x="20" y="21" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="bold">Task04 - C++ source</text><text x="22" y="44" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  1</tspan><tspan dx="16">#include &lt;iostream&gt;</tspan></text><text x="22" y="66" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  2</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="88" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  3</tspan><tspan dx="16">    int a = 7, b = 2;</tspan></text><text x="22" y="110" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  4</tspan><tspan dx="16">    double c = a / b;</tspan></text><text x="22" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  5</tspan><tspan dx="16">    double d = static_cast&lt;double&gt;(a) / b;</tspan></text><text x="22" y="154" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  6</tspan><tspan dx="16">    std::cout &lt;&lt; c &lt;&lt; ' ' &lt;&lt; d &lt;&lt; '\n';</tspan></text><text x="22" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  7</tspan><tspan dx="16">    char ch = 'A' + 2;</tspan></text><text x="22" y="198" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  8</tspan><tspan dx="16">    std::cout &lt;&lt; ch &lt;&lt; ' ' &lt;&lt; ch + 1 &lt;&lt; '\n';</tspan></text><text x="22" y="220" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  9</tspan><tspan dx="16">    bool flag = 5;</t