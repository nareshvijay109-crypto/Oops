<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="598" viewBox="0 0 1180 598"><rect width="100%" height="100%" fill="#0d1117"/><rect x="0" y="0" width="1180" height="30" fill="#161b22"/><text x="20" y="21" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="bold">Task07 - C++ source</text><text x="22" y="44" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  1</tspan><tspan dx="16">#include &lt;iostream&gt;</tspan></text><text x="22" y="66" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  2</tspan><tspan dx="16">bool proceduralCanTravel(long long balance, long long fare) {</tspan></text><text x="22" y="88" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  3</tspan><tspan dx="16">    return fare &gt;= 0 &amp;&amp; balance - fare &gt;= 5000;</tspan></text><text x="22" y="110" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  4</tspan><tspan dx="16">}</tspan></text><text x="22" y="132" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  5</tspan><tspan dx="16">class SmartCard {</tspan></text><text x="22" y="154" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  6</tspan><tspan dx="16">    long long balancePaise;</tspan></text><text x="22" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  7</tspan><tspan dx="16">    static constexpr long long minimum = 5000;</tspan></text><text x="22" y="198" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  8</tspan><tspan dx="16">public:</tspan></text><text x="22" y="220" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590">  9</tspan><tspan dx="16">    explicit SmartCard(long long balance) : balancePaise(balance) {}</tspan></text><text x="22" y="242" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 10</tspan><tspan dx="16">    bool canTravel(long long fare) const {</tspan></text><text x="22" y="264" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 11</tspan><tspan dx="16">        return fare &gt;= 0 &amp;&amp; balancePaise - fare &gt;= minimum;</tspan></text><text x="22" y="286" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 12</tspan><tspan dx="16">    }</tspan></text><text x="22" y="308" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 13</tspan><tspan dx="16">    bool deduct(long long fare) {</tspan></text><text x="22" y="330" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 14</tspan><tspan dx="16">        if (!canTravel(fare)) return false;</tspan></text><text x="22" y="352" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 15</tspan><tspan dx="16">        balancePaise -= fare; return true;</tspan></text><text x="22" y="374" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 16</tspan><tspan dx="16">    }</tspan></text><text x="22" y="396" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 17</tspan><tspan dx="16">    long long balance() const { return balancePaise; }</tspan></text><text x="22" y="418" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 18</tspan><tspan dx="16">};</tspan></text><text x="22" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 19</tspan><tspan dx="16">int main() {</tspan></text><text x="22" y="462" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 20</tspan><tspan dx="16">    long long proceduralBalance = 10000, f = 3600;</tspan></text><text x="22" y="484" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 21</tspan><tspan dx="16">    if (proceduralCanTravel(proceduralBalance,f)) proceduralBalance -= f;</tspan></text><text x="22" y="506" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 22</tspan><tspan dx="16">    SmartCard card(10000); card.deduct(f);</tspan></text><text x="22" y="528" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 23</tspan><tspan dx="16">    std::cout &lt;&lt; &quot;Procedural balance=&quot; &lt;&lt; proceduralBalance</tspan></text><text x="22" y="550" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 24</tspan><tspan dx="16">              &lt;&lt; &quot;\nOOP balance=&quot; &lt;&lt; card.balance() &lt;&lt; '\n';</tspan></text><text x="22" y="572" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3"><tspan fill="#7d8590"> 25</tspan><tspan dx="16">}</tspan></text></svg>